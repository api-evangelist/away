server:
  name: away-ucp-shopping
  description: >-
    Away's storefront exposes an agent-commerce MCP endpoint implementing the
    Universal Commerce Protocol (UCP, ucp.dev) service dev.ucp.shopping. Agents
    discover it via /.well-known/ucp and /llms.txt. Checkout requires explicit
    human (buyer) approval at the moment of payment. Built on Shopify, which
    supports UCP natively across stores.
  transport: http
  protocol: ucp
  url: https://www.awaytravel.com/api/ucp/mcp
  discovery: https://www.awaytravel.com/.well-known/ucp
  spec: https://ucp.dev/2026-04-08/specification/overview/
