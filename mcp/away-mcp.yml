  ucp_version: '2026-04-08'
  supported_versions:
  - '2026-04-08'
  - '2026-01-23'
  authentication: >-
    Read/browse is unauthenticated. Buyer-authorized checkout via Shopify
    customer accounts (OpenID Connect, scope customer-account-mcp-api:full) or
    Shop Pay via the Shop skill (https://shop.app/SKILL.md).
notes: >-
