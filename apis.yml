aid: away
name: Away
description: >-
  Away (Away: Built for modern travel) is a direct-to-consumer travel and
  lifestyle brand that designs and sells thoughtfully engineered suitcases,
  bags, and travel accessories built for modern travel. Its storefront at
  awaytravel.com runs on Shopify and is agent-commerce ready: it publishes an
  /llms.txt and /agents.md with agent instructions, implements the Universal
  Commerce Protocol (UCP, ucp.dev) service dev.ucp.shopping over a Model
  Context Protocol (MCP) endpoint for buyer-approved catalog search, cart, and
  checkout, and exposes Shopify Customer Account OpenID Connect authentication.
  Surfaced in the API Evangelist network as a portfolio company of Accel,
  Battery Ventures, and Forerunner Ventures; enriched from its live public
  discovery surfaces.
